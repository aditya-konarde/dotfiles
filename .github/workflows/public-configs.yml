name: Public config checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  privacy-and-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Install Gitleaks
        run: go install github.com/gitleaks/gitleaks/v8@v8.30.1
      - name: Check public files for personal data
        run: python3 scripts/check-public-configs.py
      - name: Scan current files and Git history for credentials
        run: |
          gitleaks dir --redact --no-banner .
          gitleaks git --log-opts=--all --redact --no-banner .
