[accessibility]
ui_scale = 1.20

[lockscreen]
transition = []
transition_duration = 100.0 # minimum accepted; empty transition list disables effects
blur_intensity = 0.0
blurred_desktop = false
tint_intensity = 0.1
wallpaper = "~/.config/noctalia/wallpapers/monochrome-mist.png"

[bar.default]
center = [ "workspaces", "scratch_indicator" ]
concave_edge_corners = false
end = [ "tray", "tray_gap", "volume", "notifications", "home", "clock" ]
margin_edge = 0
margin_ends = 0
radius_bottom_left = 0
radius_bottom_right = 0
radius_top_left = 0
radius_top_right = 0
scale = 1.10
start = [ "session", "launcher", "active_window" ]
thickness = 35

[shell]
app_icon_colorize = true
app_icon_color = "on_surface"
clipboard_image_action_command = "satty -f -"
clipboard_history_max_entries = 10
launch_apps_as_systemd_services = true
polkit_agent = false
settings_show_advanced = false

    [shell.greeter_sync]
    auto_sync = true

    [shell.panel]
    open_near_click_control_center = false
    control_center_placement = "floating"
    control_center_position = "top_right"
    session_placement = "floating"
    session_position = "center"

    [shell.screenshot]
    copy_to_clipboard = false
    pipe_command = "satty -f -"
    pipe_to_command = true
    save_to_file = false

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[system.monitor]
gpu_poll_seconds = 2

[theme]
mode = "dark"
source = "custom"
custom_palette = "NeutralDark"
pure_black_dark = false
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "kcolorscheme", "hyprland", "qt", "alacritty" ]

[widget.clock]
color = "on_surface"
format = "{:%a %-d %b · %H:%M}"

[widget.launcher]
color = "secondary"

[widget.media]
hide_when_no_media = true
album_art_only = true

[widget.network]
color = "secondary"
show_label = false
show_vpn_label = false

[widget.notifications]
color = "on_surface"

[widget.session]
color = "secondary"

[widget.scratch_indicator]
type = "local/scratch-workspace-indicator:scratch-workspace-indicator"
active_style = "fill"
hide_inactive = true
max_label_chars = 0

[widget.spacer_1]
type = "spacer"

[widget.tray]
color = "on_surface"
match_adjacent_spacing = true
capsule = false
capsule_fill = "on_secondary"

[widget.volume]
color = "on_surface"
show_label = false

[widget.workspaces]
active_pill_size = 1.5
capsule = true
capsule_fill = "on_primary"
font_weight = 700
hide_when_empty = false
inactive_pill_size = 1.0
pill_scale = 0.80
show_labels = true

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "power_profile"

[[control_center.shortcuts]]
type = "local/audio-output-cycle:cycle"

[widget.home]
type = "custom_button"
glyph = "adjustments-horizontal"
color = "on_surface"
tooltip = "Control Center"

[widget.home.actions]
left = "panel-toggle control-center home"

[shell.window_switcher]
mru = true

# Keep search focused; category filters remain available with Tab.
[shell.launcher]
categories = false
show_app_origin_indicator = false


# No shell or wallpaper animations.
[shell.animation]
enabled = false

[wallpaper]
transition = []
transition_duration = 100.0 # minimum accepted; empty transition list disables effects
transition_on_startup = false

# Separate app-owned tray icons from consistent system controls.
[widget.tray_gap]
type = "spacer"
length = 8
interactive = false

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = ["lockscreen-login-box@OUTPUT_NAME", "lockscreen-widget-minimal-clock", "lockscreen-widget-minimal-date", "lockscreen-widget-shield"]

[lockscreen_widgets.grid]
visible = false
cell_size = 16
major_interval = 4

[lockscreen_widgets.widget."lockscreen-login-box@OUTPUT_NAME"]
box_height = 70.0
box_width = 810.0
cx = 1920.0
cy = 1080.0
output = "OUTPUT_NAME"
placement_height = 2160.0
placement_width = 3840.0
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@OUTPUT_NAME".settings]
background_color = "surface_variant"
background_opacity = 0.55
background_radius = 12.0
center_password_text = true
input_opacity = 0.7
input_radius = 6.0
layout = "compact"
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_media = false
show_session_buttons = false
show_unlock_hint = false
show_weather = false

[lockscreen_widgets.widget.lockscreen-widget-minimal-clock]
box_height = 230.0
box_width = 740.0
cx = 1920.0
cy = 332.3125
output = "OUTPUT_NAME"
placement_height = 2160.0
placement_width = 3840.0
rotation = 0.0
type = "clock"

[lockscreen_widgets.widget.lockscreen-widget-minimal-clock.settings]
background = false
center_text = true
color = "on_surface"
font_family = "sans-serif"
format = "{:%H:%M}"
shadow = false

[lockscreen_widgets.widget.lockscreen-widget-minimal-date]
box_height = 48.0
box_width = 680.0
cx = 1920.0
cy = 443.640625
output = "OUTPUT_NAME"
placement_height = 2160.0
placement_width = 3840.0
rotation = 0.0
type = "clock"

[lockscreen_widgets.widget.lockscreen-widget-minimal-date.settings]
background = false
center_text = true
color = "on_surface"
font_family = "sans-serif"
format = "{:%A, %d %B}"
shadow = false

[lockscreen_widgets.widget.lockscreen-widget-shield]
box_height = 0.0
box_width = 0.0
cx = 1920.0
cy = 1003.0859375
output = "OUTPUT_NAME"
placement_height = 2160.0
placement_width = 3840.0
rotation = 0.0
type = "button"

[lockscreen_widgets.widget.lockscreen-widget-shield.settings]
background = true
glyph = "user-shield"
variant = "default"
