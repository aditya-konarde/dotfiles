[accessibility]
ui_scale = 1.20

[lockscreen]
transition = []
transition_duration = 100.0 # minimum accepted; empty transition list disables effects

[bar.default]
center = [ "workspaces" ]
concave_edge_corners = false
end = [ "tray", "tray_gap", "volume", "notifications", "home", "clock" ]
margin_edge = 0
margin_ends = 0
radius_bottom_left = 0
radius_bottom_right = 0
radius_top_left = 0
radius_top_right = 0
scale = 1.10
start = [ "session", "launcher" ]
thickness = 35

[shell]
app_icon_colorize = true
app_icon_color = "on_surface"
clipboard_image_action_command = "satty -f -"
clipboard_history_max_entries = 10
# Use the same paste shortcut in GUI apps and Kitty.
clipboard_auto_paste = "ctrl_v"
launch_apps_as_systemd_services = true
polkit_agent = false
settings_show_advanced = false

    [shell.greeter_sync]
    auto_sync = true

    [shell.panel]
    open_near_click_control_center = false
    control_center_placement = "floating"
    control_center_position = "top_right"
    session_placement = "floating"
    session_position = "center"

    [shell.screenshot]
    copy_to_clipboard = false
    pipe_command = "satty -f -"
    pipe_to_command = true
    save_to_file = false

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 3.0
    enabled = false
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[system.monitor]
gpu_poll_seconds = 5

[theme]
custom_palette = "NeutralOLED"
mode = "dark"
source = "custom"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "gtk3", "gtk4", "hyprland", "kcolorscheme", "qt" ]

[widget.clock]
color = "on_surface"
format = "{:%a %-d %b · %H:%M}"

[widget.launcher]
color = "secondary"

[widget.media]
hide_when_no_media = true
album_art_only = true

[widget.network]
color = "secondary"
show_label = false
show_vpn_label = false

[widget.notifications]
color = "on_surface"

[widget.session]
color = "secondary"

[widget.tray]
color = "on_surface"
match_adjacent_spacing = true
capsule = false
capsule_fill = "on_secondary"

[widget.volume]
color = "on_surface"
show_label = false

[widget.workspaces]
active_pill_size = 1.5
capsule = true
capsule_fill = "on_primary"
font_family = "JetBrainsMono Nerd Font"
font_weight = 700
hide_when_empty = false
inactive_pill_size = 1.0
label_source = "name"
max_label_chars = 20
pill_scale = 0.80
show_labels = true

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "power_profile"

[[control_center.shortcuts]]
type = "local/audio-output-cycle:cycle"

[widget.home]
type = "custom_button"
glyph = "adjustments-horizontal"
color = "on_surface"
tooltip = "Control Center"

[widget.home.actions]
left = "panel-toggle control-center home"

[shell.window_switcher]
mru = true

# Keep search focused; category filters remain available with Tab.
[shell.launcher]
categories = false
show_app_origin_indicator = false


# No shell or wallpaper animations.
[shell.animation]
enabled = false

[wallpaper]
transition = []
transition_duration = 100.0 # minimum accepted; empty transition list disables effects
transition_on_startup = false

# Separate app-owned tray icons from consistent system controls.
[widget.tray_gap]
type = "spacer"
length = 8
interactive = false
