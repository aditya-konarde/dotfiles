[accessibility]
ui_scale = 1.20

[bar.default]
center = [ "workspaces", "scratch_indicator" ]
concave_edge_corners = true
end = [ "media", "tray", "network", "volume", "notifications", "home", "clock" ]
margin_edge = 0
margin_ends = 0
radius_bottom_left = 12
radius_bottom_right = 12
radius_top_left = 0
radius_top_right = 0
scale = 1.10
start = [ "session", "launcher", "spacer_1", "active_window" ]
thickness = 35

[shell]
clipboard_image_action_command = "satty -f -"
launch_apps_as_systemd_services = true
polkit_agent = false
settings_show_advanced = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.panel]
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"

    [shell.screenshot]
    copy_to_clipboard = false
    pipe_command = "satty -f -"
    pipe_to_command = true
    save_to_file = false

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[system.monitor]
gpu_poll_seconds = 2

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "kcolorscheme", "kitty", "qt", "alacritty" ]

[widget.clock]
color = "secondary"
format = "{:%a %d %b · %H:%M}"

[widget.launcher]
color = "secondary"

[widget.media]
hide_when_no_media = true
album_art_only = true

[widget.network]
color = "secondary"
show_label = false
show_vpn_label = false

[widget.notifications]
color = "secondary"

[widget.session]
color = "error"

[widget.scratch_indicator]
type = "local/scratch-workspace-indicator:scratch-workspace-indicator"
active_style = "fill"
hide_inactive = true
max_label_chars = 0

[widget.spacer_1]
type = "spacer"

[widget.tray]
capsule = true
capsule_fill = "on_secondary"

[widget.volume]
color = "secondary"
show_label = false

[widget.workspaces]
active_pill_size = 2.5
capsule = true
capsule_fill = "on_primary"
font_weight = 700
hide_when_empty = true
inactive_pill_size = 1.0
pill_scale = 0.80
show_labels = true

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "power_profile"

[[control_center.shortcuts]]
type = "local/audio-output-cycle:cycle"

[widget.home]
type = "custom_button"
glyph = "home"
color = "secondary"
tooltip = "Control Center Home"

[widget.home.actions]
left = "panel-toggle control-center home"
