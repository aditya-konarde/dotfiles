# Font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Cursor
cursor_shape          beam
cursor_beam_thickness 1.8
cursor_blink_interval 0.5

# Scrollback
scrollback_lines 10000

# Mouse & Clipboard
url_style              curly
detect_urls            yes
underline_hyperlinks   hover
open_url_with          default
copy_on_select         clipboard
strip_trailing_spaces  smart

# Mouse mappings for opening links
mouse_map left click grabbed,ungrabbed mouse_handle_click selection link prompt
mouse_map shift+left click grabbed,ungrabbed mouse_handle_click selection link prompt
mouse_map ctrl+left release grabbed,ungrabbed mouse_handle_click link
mouse_map ctrl+left press grabbed discard_event
mouse_map ctrl+shift+left release grabbed,ungrabbed mouse_handle_click link
mouse_map ctrl+shift+left press grabbed discard_event

# Window
window_padding_width  8
placement_strategy    center
hide_window_decorations yes
confirm_os_window_close 0
remember_window_size no
initial_window_width 1200
initial_window_height 800

# Tab bar
tab_bar_style       powerline
tab_powerline_style slanted
tab_bar_edge        bottom
tab_title_template  " {index}: {title} "

# Layouts (splits is the default; first entry wins)
enabled_layouts splits:split_axis=auto,tall,fat,grid,stack
startup_session ~/.config/kitty/startup.session

# Shortcuts for tiling
map ctrl+shift+enter launch --location=split --cwd=current
map ctrl+shift+l     next_layout
map ctrl+shift+z     toggle_layout stack

# Navigate splits
map ctrl+shift+left  neighboring_window left
map ctrl+shift+down  neighboring_window down
map ctrl+shift+up    neighboring_window up
map ctrl+shift+right neighboring_window right

# Resize splits
map ctrl+shift+r start_resizing_window

# Swap / reorder splits
map ctrl+shift+alt+left  move_window left
map ctrl+shift+alt+down  move_window down
map ctrl+shift+alt+up    move_window up
map ctrl+shift+alt+right move_window right
map ctrl+shift+f         layout_action rotate

# Pop the focused split out into its own OS window
map ctrl+shift+alt+x     detach_window new

# Performance
repaint_delay   4
input_delay     0
sync_to_monitor yes

# Bell
enable_audio_bell no
visual_bell_duration 0.0

# Background opacity
background_opacity 0.95

# ── Catppuccin Mocha theme ──
foreground              #CDD6F4
background              #1E1E2E
selection_foreground     #1E1E2E
selection_background     #F5E0DC
cursor                  #F5E0DC
cursor_text_color       #1E1E2E
url_color               #F5E0DC

# black
color0  #45475A
color8  #585B70

# red
color1  #F38BA8
color9  #F38BA8

# green
color2  #A6E3A1
color10 #A6E3A1

# yellow
color3  #F9E2AF
color11 #F9E2AF

# blue
color4  #89B4FA
color12 #89B4FA

# magenta
color5  #F5C2E7
color13 #F5C2E7

# cyan
color6  #94E2D5
color14 #94E2D5

# white
color7  #BAC2DE
color15 #A6ADC8

# Tab bar colors
active_tab_foreground   #1E1E2E
active_tab_background   #CBA6F7
active_tab_font_style   bold
inactive_tab_foreground #CDD6F4
inactive_tab_background #181825
inactive_tab_font_style normal

# macOS
macos_titlebar_color    #1E1E2E
macos_option_as_alt     yes
macos_quit_warn         2

# Linux (Wayland)
wayland_titlebar_color  #1E1E2E
include themes/noctalia.conf
