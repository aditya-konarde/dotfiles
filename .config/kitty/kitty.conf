# Font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Cursor
cursor_shape          beam
cursor_beam_thickness 1.8
cursor_blink_interval 0
cursor_trail 0

# Scrollback
scrollback_lines 10000

# Mouse & Clipboard
focus_follows_mouse    yes
url_style              curly
detect_urls            yes
underline_hyperlinks   hover
open_url_with          default
copy_on_select         clipboard
strip_trailing_spaces  smart

# Mouse mappings for opening links
mouse_map left click grabbed,ungrabbed mouse_handle_click selection link prompt
mouse_map shift+left click grabbed,ungrabbed mouse_handle_click selection link prompt
mouse_map ctrl+left release grabbed,ungrabbed mouse_handle_click link
mouse_map ctrl+left press grabbed discard_event
mouse_map ctrl+shift+left release grabbed,ungrabbed mouse_handle_click link
mouse_map ctrl+shift+left press grabbed discard_event

# Window
# Keep pane dividers steady when mouse hover changes focus.
# Dim on purpose: a static divider is a burn-in risk on OLED (matches Hyprland).
active_border_color   #232D3D
inactive_border_color #232D3D
window_padding_width  8
placement_strategy    center
hide_window_decorations yes
confirm_os_window_close -1 count-background
remember_window_size no
initial_window_width 1200
initial_window_height 800

# Tab bar
tab_bar_style       separator
tab_separator       "   "
tab_bar_edge        bottom
tab_title_template  " {index}: {title} "

# Layouts (splits is the default; first entry wins)
enabled_layouts splits:split_axis=auto,tall,fat,grid,stack
startup_session ~/.config/kitty/startup.session

# Shortcuts for tiling
map ctrl+shift+enter launch --location=split --cwd=current
map ctrl+shift+l     next_layout
map ctrl+shift+z     toggle_layout stack

# Navigate splits
map ctrl+shift+left  neighboring_window left
map ctrl+shift+down  neighboring_window down
map ctrl+shift+up    neighboring_window up
map ctrl+shift+right neighboring_window right

# Resize splits
map ctrl+shift+r start_resizing_window

# Swap / reorder splits
map ctrl+shift+alt+left  move_window left
map ctrl+shift+alt+down  move_window down
map ctrl+shift+alt+up    move_window up
map ctrl+shift+alt+right move_window right
map ctrl+shift+alt+f     layout_action rotate
# Ctrl-Shift-F opens scrollback; optional host Command-key mappings can forward it.
# Open searchable scrollback (press / to search in the pager).
map ctrl+shift+f         show_scrollback
map ctrl+shift+t         new_tab_with_cwd
map ctrl+shift+w         close_window_with_confirmation ignore-shell

# Pop the focused split out into its own OS window
map ctrl+shift+alt+x     detach_window new

# Performance (tuned for 120Hz / 8.33ms frame budget)
repaint_delay   6
input_delay     1
sync_to_monitor yes

# Bell
enable_audio_bell no
visual_bell_duration 0.0

# Background opacity
background_opacity 1.0

# Stable semantic colors with neutral window chrome.
# Mirrors the Noctalia NeutralOLED palette (true black for OLED); kept static
# here so it stays independent of wallpaper-generated Noctalia colors.
foreground              #D8D8D8
background              #000000
selection_foreground    #FFFFFF
selection_background    #36465F
cursor                  #D8D8D8
cursor_text_color       #000000
url_color               #61AFEF

# black
color0  #16181A
color8  #727985

# red
color1  #E06C75
color9  #E06C75

# green
color2  #98C379
color10 #98C379

# yellow
color3  #E5C07B
color11 #E5C07B

# blue
color4  #61AFEF
color12 #61AFEF

# magenta
color5  #C678DD
color13 #C678DD

# cyan
color6  #56B6C2
color14 #56B6C2

# white
color7  #C8CCD2
color15 #E6E6E6

# Tab bar colors
active_tab_foreground   #A6C8DF
active_tab_background   #101214
active_tab_font_style   bold
inactive_tab_foreground #B4BAC2
inactive_tab_background #000000
inactive_tab_font_style normal

# macOS compatibility settings retained from the public profile.
macos_titlebar_color    #000000
macos_option_as_alt     yes

# Title bar color
wayland_titlebar_color  #000000

# Disable smooth movement on the default line-scroll shortcuts.
map ctrl+shift+k scroll_line_up
map ctrl+shift+j scroll_line_down

# Allow Wispr Flow clipboard injection using Ctrl+V.
map ctrl+v paste_from_clipboard

# Copy selected text; preserve Ctrl+C interrupt when nothing is selected.
map ctrl+c copy_or_interrupt
