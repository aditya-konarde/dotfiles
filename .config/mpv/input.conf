# Toggle upscaling shaders (ArtCNN luma + CfL chroma)
CTRL+1 no-osd change-list glsl-shaders set "~~/shaders/ArtCNN_C4F32.glsl:~~/shaders/CfL_Prediction.glsl"; show-text "ArtCNN C4F32 + CfL (HQ)"
CTRL+2 no-osd change-list glsl-shaders set "~~/shaders/ArtCNN_C4F16.glsl:~~/shaders/CfL_Prediction.glsl"; show-text "ArtCNN C4F16 + CfL (Fast)"
CTRL+0 no-osd change-list glsl-shaders clr ""; show-text "Shaders cleared"
