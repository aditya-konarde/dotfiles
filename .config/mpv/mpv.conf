# High-quality base profile
profile=high-quality

# Video output — gpu-next (libplacebo) is required for best shader support
vo=gpu-next
gpu-api=vulkan
vulkan-async-compute=yes
vulkan-async-transfer=yes

# Hardware decoding — auto-copy-safe avoids breaking shader pipeline
hwdec=auto-copy-safe

# Luma upscaling — ArtCNN C4F16 for real-time 1080p60 to 4K playback
glsl-shader="~~/shaders/ArtCNN_C4F16.glsl"
# Fallback if ArtCNN doesn't trigger (e.g. native res content)
scale=ewa_lanczos
scale-blur=0.981251

# Chroma upscaling — CfL infers chroma from luma correlation (replaces KrigBilateral)
glsl-shader="~~/shaders/CfL_Prediction.glsl"

# Luma downscaling
dscale=catmull_rom

# Anti-ringing — reduces overshoot from sharp scalers
scale-antiring=0.5
dscale-antiring=0.5
cscale-antiring=0.5

# Dithering — lightweight mode validated for 4K playback
dither=fruit
dither-depth=auto

# Debanding (helps with low-bitrate sources)
deband=yes
deband-iterations=4
deband-threshold=35
deband-range=16
deband-grain=5

# Optional comparison profile; the default above remains ArtCNN C4F16 + CfL.
[fsrcnnx-cfl]
profile-desc=FSRCNNX x2 + CfL comparison
glsl-shaders="~~/shaders/FSRCNNX_x2_8-0-4-1.glsl:~~/shaders/CfL_Prediction.glsl"
